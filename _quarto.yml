project:
  type: book
  output-dir: _book

book:
  title: "Data"
  author: "Julio Toboso"
  chapters:
    - index.qmd
    - part: "Sample Space"
      chapters:
        - sample-space/index.qmd
        - sample-space/maps-and-reality.qmd
        - sample-space/randomness-and-pattern.qmd
        - sample-space/outcomes-and-events.qmd
        - sample-space/finite-and-infinite.qmd
        - sample-space/kolmogorov.qmd   
    - part: "Statistics"
      chapters:
        - statistics/index.qmd
        - statistics/statistical-thinking.qmd
        - statistics/variation.qmd
        - statistics/uncertainty.qmd
        - statistics/distributions/index.qmd
        - statistics/distributions/normal.qmd
        - statistics/distributions/student.qmd
        - statistics/distributions/lognormal.qmd
        - statistics/distributions/pareto.qmd
        - statistics/distributions/binomial.qmd
        - statistics/statistical-modeling.qmd
        - statistics/statistical-methods.qmd        
    
format:
  html:
    theme: lux
    code-copy: true
    code-fold: show

execute:
  execute-notebooks: auto
